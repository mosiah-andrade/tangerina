name: App CI

on:
  push:
    branches:
      - main
      - feat/t8-estrutura-aplicacao
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Print Prettier-formatted unit test for diagnosis
        run: npx prettier tests/format-money.test.mjs

      - name: Print formatted persistence files for diagnosis
        run: |
          npx prettier lib/persistence/entities.ts
          npx prettier tests/persistence-database.test.mjs

      - name: Check formatting of new test utilities
        run: >-
          npx prettier --check lib/format-money.ts tests/format-money.test.mjs package.json
          lib/persistence/README.md lib/persistence/database.ts
          lib/persistence/entities.ts tests/persistence-database.test.mjs
          tests/persistence-entities.typecheck.ts

      - name: Build production app
        run: npm run build
